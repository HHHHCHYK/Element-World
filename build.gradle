plugins {
	id 'fabric-loom' version '1.9-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"elementworld" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}


dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

tasks.register('codeStyleCheck') {
	group = 'verification'
	description = 'Checks project-specific style rules that do not need external tools.'

	doLast {
		def violations = []
		def bannedSnippets = [
			'System.out',
			'printStackTrace(',
			'Hello Fabric world',
			'This is an example description',
			'fabric-example-mod',
			'another-mod'
		]

		fileTree('src') {
			include '**/*.java', '**/*.json'
		}.each { file ->
			file.eachLine { line, number ->
				bannedSnippets.each { snippet ->
					if (line.contains(snippet)) {
						violations << "${file}:${number}: banned snippet '${snippet}'"
					}
				}
				if (file.name.endsWith('.java') && line ==~ /\s*import\s+.+\.\*;\s*/) {
					violations << "${file}:${number}: wildcard imports are not allowed"
				}
			}
		}

		fileTree('src') {
			include '**/*.java'
		}.each { file ->
			if (file.name.contains('_')) {
				violations << "${file}: Java source file names must not contain underscores"
			}
		}

		if (!violations.isEmpty()) {
			throw new GradleException("Code style check failed:\n" + violations.join('\n'))
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('codeStyleCheck')
}
